[project]
name = "companion"
version = "0.8.0"
description = "Personal AI agent for managing knowledge, finding information, and staying focused on important tasks"
readme = "README.md"
authors = [
    { name = "spacer", email = "f-balykin@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "aiosqlite>=0.22.1",
    "companion-core",
    "faster-whisper>=1.2.1",
    "openai-agents>=0.22.0",
    "pydantic>=2.13.4",
    "pyvips>=3.2.0",
    "rank-bm25>=0.2.2",
    "telegramify-markdown[mermaid]>=1.2.0",
]

[project.scripts]
companion = "companion:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "companion-core",
]

[tool.uv.sources]
companion-core = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
